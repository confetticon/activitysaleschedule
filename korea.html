<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>韓國場追蹤</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8484f'/%3E%3Ccircle cx='32' cy='32' r='13' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1b1c1f; --mute:#6b6f76; --line:#e6e3dd; --chip:#efece6;
  --accent:#e8484f; --accent-ink:#fff; --gold:#f2c14e; --gold-soft:#fff4d6; --gap:#e9f6ea; --hol:#efe9f7; --past:#ecebe8;
  --kr:#f9dbe4; --jp:#fbe3d2; --tw:#dcefd8; --we:#d9e7f7; --fest:#e7def5; --other:#ececec;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121316; --card:#1b1d22; --ink:#ecebe8; --mute:#9aa0a8; --line:#2a2d33; --chip:#262930;
    --accent:#ff5a5f; --gold:#e8b53a; --gold-soft:#3a3220; --gap:#1d2e22; --hol:#2c2638; --past:#1a1b1e;
    --kr:#4a2a35; --jp:#4a3326; --tw:#263d2a; --we:#233448; --fest:#352b47; --other:#2c2e33;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
a{color:inherit}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:baseline;gap:10px;padding:14px 0 8px}
.top h1{font-size:20px;margin:0;letter-spacing:.5px}
.top .upd{color:var(--mute);font-size:12px;margin-left:auto;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:var(--chip);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab .n{opacity:.6;margin-left:4px;font-size:12px}
main{padding:14px 0 60px}
section[hidden]{display:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.frows{display:grid;gap:8px;margin-bottom:12px}
.frow{display:flex;align-items:center;gap:8px;min-width:0}
.frow .flab{flex:none;font-size:12px;color:var(--mute);width:2.6em}
.frow .chips{flex:1}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.chip{appearance:none;-webkit-appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.list{display:grid;gap:10px}
@media (min-width:760px){.list.two{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card.done{opacity:.55}
.card.fol{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft) inset,var(--shadow)}
.row1{display:flex;gap:10px;align-items:flex-start}
.when{flex:none;text-align:center;min-width:62px;padding:6px 4px;border-radius:12px;background:var(--chip)}
.when .d{font-size:18px;font-weight:700;line-height:1.1}
.when .w{font-size:11px;color:var(--mute)}
.when .t{font-size:13px;font-weight:600;margin-top:2px}
.when.soon{background:var(--accent);color:var(--accent-ink)}
.when.soon .w{color:inherit;opacity:.85}
.ttl{font-weight:650;font-size:15px;line-height:1.35;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink);max-width:100%;overflow-wrap:anywhere}
.tag.kind-g{background:var(--accent);color:var(--accent-ink)}
.tag.kind-p{background:var(--gold);color:#3a2a00}
.tag.o-韓國{background:var(--kr)}.tag.o-日本{background:var(--jp)}.tag.o-台灣{background:var(--tw)}.tag.o-西洋{background:var(--we)}.tag.o-音樂祭{background:var(--fest)}
.tag.hol{background:var(--hol)}
.tag.l-zh,.ev.l-zh{background:var(--tw)}.tag.l-ko,.ev.l-ko{background:var(--kr)}.tag.l-ja,.ev.l-ja{background:var(--jp)}
.tag.l-en,.ev.l-en{background:var(--we)}.tag.l-th,.ev.l-th{background:var(--gold-soft)}.tag.l-ot,.ev.l-ot{background:var(--fest)}
.tag.st-售票中{background:var(--tw)}.tag.st-尚未開賣{background:var(--we)}.tag.st-優先購階段{background:var(--gold-soft)}.tag.st-已售完,.tag.st-售票結束{background:var(--other);color:var(--mute)}
.cd{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
.cd.hot{color:var(--accent);font-weight:700}
.sub{color:var(--mute);font-size:13px;margin-top:6px;white-space:pre-line}
details{margin-top:8px}
summary{cursor:pointer;color:var(--mute);font-size:13px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ ";}
.sched{font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;margin-top:6px;background:var(--chip);border-radius:10px;padding:8px 10px;overflow-x:auto}
.buy{display:inline-flex;align-items:center;gap:4px;margin-top:10px;background:var(--ink);color:var(--bg);text-decoration:none;padding:7px 12px;border-radius:10px;font-size:13px;font-weight:600}
.empty{color:var(--mute);text-align:center;padding:40px 0}
.daygrp{margin:18px 0 8px;font-weight:700;font-size:14px;color:var(--mute);display:flex;gap:8px;align-items:center}
.daygrp .hl{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--hol);color:var(--ink)}
/* calendar */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.calhead h2{margin:0 6px;font-size:18px;min-width:110px;text-align:center}
.navbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;width:36px;height:36px;font-size:18px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--mute);margin:8px 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .hd{font-size:12px;color:var(--mute);text-align:center;padding:2px 0}
.cal .hd.we{color:var(--accent)}
.cell{min-height:74px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.out{visibility:hidden}
.cell.past{background:var(--past);opacity:.55}
.cell.gap{background:var(--gap)}
.cell.hol{box-shadow:inset 0 0 0 2px var(--hol)}
.cell .dn{font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:4px}
.cell .dn small{font-weight:500;color:var(--mute);font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ev{font-size:11px;line-height:1.25;border-radius:6px;padding:2px 4px;background:var(--other);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:normal;overflow-wrap:anywhere;cursor:pointer}
.ev.o-韓國{background:var(--kr)}.ev.o-日本{background:var(--jp)}.ev.o-台灣{background:var(--tw)}.ev.o-西洋{background:var(--we)}.ev.o-音樂祭{background:var(--fest)}
.ev.fol{background:var(--gold);color:#3a2a00;font-weight:700}
@media (min-width:760px){.cell{min-height:96px}.ev{font-size:12px}}
.matrix{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.matrix table{border-collapse:separate;border-spacing:0;font-size:11px;min-width:100%}
.matrix th,.matrix td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:3px;text-align:center;vertical-align:middle;min-width:58px}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:var(--card);z-index:1;min-width:110px;text-align:left;font-weight:650;padding-left:8px}
.matrix thead th{position:sticky;top:0;background:var(--card);z-index:2;font-weight:600}
.matrix thead th.we{color:var(--accent)}
.matrix thead th.hol{background:var(--hol)}
.matrix td.gap{background:var(--gap)}
.matrix td.past{background:var(--past)}
.matrix .ev{-webkit-line-clamp:3}
.grp{font-size:11px;color:var(--mute);font-weight:500}
dialog{border:0;border-radius:18px;padding:0;max-width:min(520px,92vw);width:100%;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg{padding:16px}
.dlg .x{float:right;border:0;background:var(--chip);color:var(--ink);border-radius:999px;width:30px;height:30px;font-size:16px;cursor:pointer}
footer{color:var(--mute);font-size:12px;text-align:center;padding:30px 0}
.star{flex:none;border:0;background:transparent;color:var(--mute);font-size:20px;line-height:1;cursor:pointer;padding:2px 4px;margin:-2px -4px 0 0}
.star.on{color:var(--gold)}
.folbtn{border:0;background:var(--gold);color:#3a2a00;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:650;cursor:pointer;white-space:nowrap}
.flist{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.flist .tag{display:inline-flex;align-items:center;gap:4px;background:var(--gold-soft);font-size:13px;padding:4px 6px 4px 10px}
.flist .tag button{border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:14px}
.addrow{display:flex;gap:6px}
.btn2{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.btnp{border:0;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font:inherit;font-weight:650;cursor:pointer;width:100%;margin-top:12px}
.note{font-size:12.5px;color:var(--mute);margin-top:8px;line-height:1.5}
</style>
<style>.toplink{font-size:13px;color:var(--mute);text-decoration:none;white-space:nowrap}.kst{color:var(--mute);font-size:11px}</style>
</head>

<header>
  <div class="wrap">

</main>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P = s => s ? new Date(s) : null;
const W = '日一二三四五六';
const store = { get(k,d){try{const v=localStorage.getItem('ct_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
                set(k,v){try{localStorage.setItem('ct_'+k,JSON.stringify(v))}catch(e){}} };
const lc = s => String(s||'').normalize('NFKC').toLowerCase();
function kwHit(k, low){
  if (!k) return false;
  if (k.length <= 4 && /^[a-z0-9.\-&= ]+$/.test(k))
    return new RegExp('(^|[^a-z0-9])' + k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '([^a-z0-9]|$)').test(low);
  return low.includes(k);
}
const FOL = store.get('follow', null) || D.follow || [];
const isFol = t => { const low = lc(t); return FOL.some(n => kwHit(lc(n), low)); };
$('#upd').textContent = '更新於 ' + (D.generated||'').slice(5,16).replace('-','/').replace('T',' ');
function whenBox(d, hot){
  if (!d) return `<div class="when"><div class="d">未定</div></div>`;
  return `<div class="when${hot?' soon':''}"><div class="d">${d.getMonth()+1}/${d.getDate()}</div><div class="w">週${W[d.getDay()]}</div><div class="t">${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</div></div>`;
}
function left(d){ const h = (d - new Date())/36e5; if (h < 0) return ''; if (h < 1) return `<span class="cd hot">${Math.round(h*60)} 分鐘後</span>`;
  if (h < 48) return `<span class="cd hot">${Math.round(h)} 小時後</span>`; return `<span class="cd">${Math.round(h/24)} 天後</span>`; }
function card(e, d, lab){
  const fo = isFol(e.t), hot = d && (d - new Date()) < 864e5 && d > new Date();
  return `<article class="card${fo?' fol':''}"><div class="row1">${whenBox(d, hot)}
    <div style="min-width:0;flex:1"><div class="ttl">${fo?'★ ':''}${esc(e.t)}</div>
    <div class="meta">${lab||''}<span class="tag">${esc(e.p)}</span><span class="tag st-${esc(e.st)}">${esc(e.st)}</span>${d?left(d):''}</div>
    <div class="sub">${esc(e.v||'')}${e.perf?'\n'+esc(e.perf):''}</div>
    <details><summary>售票時程</summary><div class="sched">${esc(e.sch||'')}</div></details>
    ${e.u?`<a class="buy" href="${esc(e.u)}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">前往購票 ↗</a>`:''}</div></div></article>`;
}
function sales(e){
  const out = [], n = new Date(Date.now() - 36e5);
  (e.sch||'').split('\n').forEach(l => { const m = l.match(/^[▶・]\s*(\d{2})\/(\d{2})\([^)]*\)\s*(\d{2}):(\d{2})(?:～\d{2}:\d{2})?\s*(.+)$/); if (!m) return;
    const g = new Date(); let y = g.getFullYear(); if (+m[1] < g.getMonth()+1-6) y++;
    const d = new Date(y, +m[1]-1, +m[2], +m[3], +m[4]); if (d > n) out.push({d, what: m[5].replace(/（韓國.*$/,'')}); });
  return out;
}
/* 即將開賣 */
function renderUp(){
  const f = store.get('krUpF','all');
  $('#up-f').innerHTML = [['all','全部'],['fol','★ 關注']].map(([k,t]) => `<button class="chip${f===k?' on':''}" data-f="${k}">${t}</button>`).join('');
  const end = Date.now() + D.days*864e5, items = [];
  D.events.forEach(e => sales(e).forEach(s => { if (s.d <= end && (f==='all' || isFol(e.t))) items.push({e, s}); }));
  items.sort((a,b) => a.s.d - b.s.d);
  $('#n-up').textContent = items.length;
  $('#up-list').innerHTML = items.length ? items.map(x => card(x.e, x.s.d, `<span class="tag ${/預售/.test(x.s.what)?'kind-p':'kind-g'}">${esc(x.s.what)}</span>`)).join('')
    : `<div class="empty">未來 ${D.days} 天沒有開賣</div>`;
}
$('#up-f').addEventListener('click', ev => { const b = ev.target.closest('[data-f]'); if (!b) return; store.set('krUpF', b.dataset.f); renderUp(); });
/* 全部場次 */
const STS = ['尚未開賣','優先購階段','售票中','已售完'];
const PLATS = [...new Set(D.events.map(e => e.p))];
function renderAllF(){
  const s = store.get('krAllF', {st:'', fol:false, p:''});
  $('#all-f').innerHTML = `<div class="frow"><span class="flab">狀態</span><div class="chips">` +
    `<button class="chip${!s.st&&!s.fol?' on':''}" data-k="st" data-v="">全部</button>` +
    `<button class="chip${s.fol?' on':''}" data-k="fol">★ 關注</button>` +
    STS.filter(x => D.events.some(e => e.st===x)).map(x => `<button class="chip${s.st===x?' on':''}" data-k="st" data-v="${x}">${x}</button>`).join('') + `</div></div>` +
    `<div class="frow"><span class="flab">平台</span><div class="chips">` +
    `<button class="chip${!s.p?' on':''}" data-k="p" data-v="">全部</button>` +
    PLATS.map(x => `<button class="chip${s.p===x?' on':''}" data-k="p" data-v="${x}">${x}</button>`).join('') + `</div></div>`;
}
function renderAll(){
  const s = store.get('krAllF', {st:'', fol:false, p:''}), q = lc($('#q').value.trim()), sort = $('#sort').value;
  let items = D.events.filter(e => (!s.fol || isFol(e.t)) && (!s.st || e.st===s.st) && (!s.p || e.p===s.p) && (!q || lc([e.t,e.v,e.perf].join(' ')).includes(q)));
  const nx = e => (sales(e)[0]||{}).d || null;
  items.sort((a,b) => { if (sort==='show') return (a.d1||'9').localeCompare(b.d1||'9');
    const A = nx(a), B = nx(b); if (A&&B) return A-B; if (A) return -1; if (B) return 1; return (a.d1||'9').localeCompare(b.d1||'9'); });
  $('#n-all').textContent = D.events.length;
  $('#all-list').innerHTML = items.length ? items.map(e => { const n = nx(e);
      const d = sort==='show' ? (e.d1 ? new Date(e.d1+'T00:00') : null) : n;
      const lab = sort==='show' ? '' : (n ? `<span class="tag ${/預售/.test(sales(e)[0].what)?'kind-p':'kind-g'}">${esc(sales(e)[0].what)}</span>` : '');
      return card(e, d, lab); }).join('') : '<div class="empty">沒有符合的場次</div>';
}
$('#all-f').addEventListener('click', ev => { const b = ev.target.closest('[data-k]'); if (!b) return;
  const s = store.get('krAllF', {st:'', fol:false, p:''}), k = b.dataset.k;
  if (k==='fol') s.fol = !s.fol;
  else if (!b.dataset.v){ s[k] = ''; if (k==='st') s.fol = false; }
  else s[k] = s[k]===b.dataset.v ? '' : b.dataset.v;
  store.set('krAllF', s); renderAllF(); renderAll(); });
$('#q').addEventListener('input', renderAll);
$('#sort').value = store.get('krSort','sale');
$('#sort').addEventListener('change', () => { store.set('krSort', $('#sort').value); renderAll(); });
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x===t));
  document.querySelectorAll('main section').forEach(s => s.hidden = s.id !== t.dataset.tab);
  store.set('krTab', t.dataset.tab); });
const tab0 = store.get('krTab','up'); const tb = document.querySelector(`.tab[data-tab="${tab0}"]`); if (tb) tb.click();
renderUp(); renderAllF(); renderAll();
</script>
